<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName localhost

    # A docker-compose-bol jovo adatbazis-adatok atadasa a PHP-nek
    PassEnv HELP_DB_DSN HELP_DB_USER HELP_DB_PASS

    # A 275 kepernyokep kulon kotetbol, nem a docroot alol
    Alias /media /srv/media
    <Directory /srv/media>
        Options -Indexes
        Require all granted
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Ami letezo fajl (assets/help.css stb.), azt kozvetlenul kiszolgaljuk,
        # minden mast az index.php sajat routere dolgoz fel.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/media/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [L]
    </Directory>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
