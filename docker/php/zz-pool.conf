; PHP-FPM munkafolyamat-keszlet (pool) a sugohoz.
;
; MIERT KELL: a hivatalos php:8.3-fpm kep alapertelmezese pm.max_children = 5.
; A gepi forditas (es a Word-import) percekig futo keres, es egy ilyen kereshez
; egy worker tartozik. Ot hosszu keres mellett MINDEN mas keres - a nyilvanos
; sugo is - sorba all, majd 503-at kap. 2026-10-07-en ez negyszer allitotta le
; az oldalt kozzeteteli munka kozben.
;
; A fajl neve zz-: a php-fpm.d/*.conf betoltese beturendben tortenik, igy ez a
; www.conf utan olvasodik be, es felulirja az alapertekeket.
;
; Memoria: a memory_limit (1024M, lasd help.ini) FELSO korlat, nem a tipikus
; fogyasztas. Ha a szerver memoriaja szuk, a pm.max_children-t csokkentsd.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
