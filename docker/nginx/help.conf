# A sugo nginx-konfigja a Docker-kornyezethez.
# Az eles valtozat (HTTPS-szel) a deploy/ mappaban van.

server {
    listen 80;
    server_name _;

    root  /var/www/html;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Word-import es oktatovideok
    client_max_body_size 512M;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Amit soha nem szolgalunk ki
    location ^~ /lib/      { deny all; }
    location = /config.php { deny all; }
    location ~ /\.         { deny all; }

    # Kepek es videok kozvetlenul a lemezrol
    location ^~ /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.(php|phtml|phar)$ { deny all; }
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Az admin sajat belepesi pont - kulon blokk kell neki, kulonben
    # a lenti szabaly miatt a nyilvanos sugo jonne be helyette.
    location = /admin.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/admin.php;
        fastcgi_read_timeout 600s;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location ~ ^/(hu|en|de)/embed/ {
        try_files $uri /index.php$is_args$args;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 600s;
    }
}
