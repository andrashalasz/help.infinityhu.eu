# Infinity Sugo - help.infinityhu.eu Docker kornyezet
#
#   docker compose up -d --build
#   -> http://localhost:8080/
#
# Az osszeallitas ugyanaz, mint az eles szerveren:
#   nginx 1.28.3  +  PHP 8.3 FPM  +  MariaDB 11.8.6
#
# A kontenerek neve a projekt nevebol jon (alapertelmezesben a mappa neve).
# Sajat nevet a "docker compose -p sugo up -d" adhat.

services:
  db:
    image: mariadb:11.8.6
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_uca1400_ai_ci
      --innodb-ft-min-token-size=2
      --max-allowed-packet=256M
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-help_infinityhu}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_USER: ${MARIADB_USER:-help}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-help}
    volumes:
      - help_dbdata:/var/lib/mysql
      # a mariadb image abc-sorrendben futtatja le ezeket az ELSO indulaskor
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # 3307 a hoston, hogy ne utkozzon egy esetleg mar futo helyi MariaDB-vel
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  php:
    build: ./docker/php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HELP_DB_DSN:  "mysql:host=db;port=3306;dbname=${MARIADB_DATABASE:-help_infinityhu};charset=utf8mb4"
      HELP_DB_USER: "${HELP_DB_USER:-help_ro}"
      HELP_DB_PASS: "${HELP_DB_PASS:-help_ro}"
      # az admin felulet ir is - kulon, iras-olvasas jogu adatbazis-felhasznalo
      HELP_DB_ADMIN_USER: "${HELP_DB_ADMIN_USER:-help_rw}"
      HELP_DB_ADMIN_PASS: "${HELP_DB_ADMIN_PASS:-help_rw}"
      HELP_MEDIA_DIR: "/srv/media"
      # gepi forditas (nem kotelezo): none | deepl | libre | google
      HELP_MT_PROVIDER: "${HELP_MT_PROVIDER:-}"
      HELP_MT_ENDPOINT: "${HELP_MT_ENDPOINT:-}"
      HELP_MT_KEY: "${HELP_MT_KEY:-}"
    volumes:
      - ./site_dinamikus:/var/www/html:ro
      - ./media:/srv/media

  web:
    image: nginx:1.28.3
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - ./docker/nginx/help.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site_dinamikus:/var/www/html:ro
      - ./media:/srv/media:ro
    ports:
      - "${WEB_PORT:-8080}:80"

  # ------------------------------------------------------------------
  # Opcionalis: sajat, helyben futo gepi fordito (LibreTranslate).
  # Nem indul el magatol - igy a szokasos "docker compose up" gyors marad.
  #
  #   docker compose --profile mt up -d
  #
  # Elso indulaskor letolti a hu/en/de nyelvi modelleket (par perc, ~1-2 GB).
  # Utana az admin Beallitasok fulen:
  #     Szolgaltato = LibreTranslate,  Vegpont = http://libretranslate:5000
  #
  # Igy nem kell fizetos API-kulcs a gepi forditashoz.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["mt"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "hu,en,de"
      LT_DISABLE_WEB_UI: "false"
    volumes:
      - help_mt_models:/home/libretranslate/.local/share/argos-translate
    ports:
      - "${MT_PORT:-5050}:5000"

volumes:
  help_dbdata:
  help_mt_models:
