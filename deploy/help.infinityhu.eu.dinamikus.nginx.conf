# /etc/nginx/sites-available/help.infinityhu.eu (DINAMIKUS valtozat)
#
# Ez a valtozat PHP-t futtat es a sajat, kulon "help_infinityhu" adatbazisat
# olvassa elo minden keresnel - nincs build/ujrageneralas lepes, a tartalom
# azonnal frissul, amint az Infinity-ben kozzeteszel valamit (ha ugyanabbol
# az adatbazisbol dolgozik, vagy replikalva van onnan).
#
# Elofeltetel a szerveren: php-fpm + php-pgsql
#   sudo apt-get install -y php-fpm php-pgsql
#
# Az adatbazis-kapcsolat adatait KORNYEZETI VALTOZOKENT add at (ne ird bele
# a config.php-ba production titkot) - lasd fpm pool "env[...]" sorokat lent,
# vagy allitsd be a szerver /etc/environment fajljaban.

server {
    listen 80;
    listen [::]:80;
    server_name help.infinityhu.eu;
    return 301 https://help.infinityhu.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name help.infinityhu.eu;

    ssl_certificate     /etc/letsencrypt/live/help.infinityhu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/help.infinityhu.eu/privkey.pem;

    root  /var/www/help.infinityhu.eu/site_dinamikus;
    index index.php;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/help.infinityhu.eu.access.log;
    error_log  /var/log/nginx/help.infinityhu.eu.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Statikus eszkozok es kepek - kozvetlenul, PHP nelkul
    location ~* \.(png|jpe?g|webp|gif|svg|ico|css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # Beagyazhato (embed) oldalak - a valodi Infinity domain(ek)et ird be
    location ~ ^/(hu|en|de)/embed/ {
        add_header Content-Security-Policy "frame-ancestors https://app.infinityhu.eu https://*.infinityhu.eu" always;
        try_files $uri /index.php$is_args$args;
    }

    # Minden mas kerest a PHP kap meg (a sajat egyszeru routere dolgozza fel)
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # igazitsd a tenyleges PHP verziohoz
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # Jelszót inkább a PHP-FPM pool sajat "env[HELP_DB_PASS] = ..." soraban add meg
        # (pl. /etc/php/8.3/fpm/pool.d/help.conf, 640-es jogosultsaggal) - ne ebben,
        # mert az nginx config tobb admin szamara is olvashato szokott lenni.
        fastcgi_param HELP_DB_DSN  "pgsql:host=127.0.0.1;port=5432;dbname=help_infinityhu";
        fastcgi_param HELP_DB_USER "help_ro";
    }
}
