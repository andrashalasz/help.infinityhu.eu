# /etc/nginx/sites-available/help.infinityhu.eu   (DINAMIKUS valtozat)
#
# A sugo PHP-t futtat es a sajat, kulon "help_infinityhu" adatbazisabol olvas.
# Nincs build-lepes: ami az adminban kozze van teve, az azonnal latszik.
#
# Elofeltetel a szerveren:
#   php-fpm php-pgsql php-xml php-zip php-gd php-mbstring php-curl
#
# Az adatbazis-jelszavak KORNYEZETI VALTOZOKENT menjenek, a PHP-FPM pool
# env[...] soraiban (/etc/php/8.3/fpm/pool.d/help.conf, 640-es joggal) -
# NE ebben a fajlban, mert ezt tobb admin is olvashatja.
# Reszletek: TELEPITES.md

upstream help_php {
    server unix:/run/php/php-help.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name help.infinityhu.eu;
    return 301 https://help.infinityhu.eu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name help.infinityhu.eu;

    ssl_certificate     /etc/letsencrypt/live/help.infinityhu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/help.infinityhu.eu/privkey.pem;

    root  /var/www/help.infinityhu.eu/site_dinamikus;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Word-import (a teljes utmutato ~27 MB) es oktatovideok miatt
    client_max_body_size 512M;

    access_log /var/log/nginx/help.infinityhu.eu.access.log;
    error_log  /var/log/nginx/help.infinityhu.eu.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;   # a text/html alapból tömörítve megy

    # ------------------------------------------------------------------
    # Amit soha nem szabad kiszolgalni
    # ------------------------------------------------------------------
    location ^~ /lib/      { deny all; }
    location = /config.php { deny all; }
    location ~ /\.         { deny all; }

    # ------------------------------------------------------------------
    # Kepek es videok: kozvetlenul a lemezrol, PHP megkerulesevel.
    # A media mappa a site_dinamikus MELLETT van, nem alatta.
    # (A zaro per mindket oldalon szamit!)
    # ------------------------------------------------------------------
    location ^~ /media/ {
        alias /var/www/help.infinityhu.eu/media/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;

        # ebben a mappaban SEMMIT nem futtatunk
        location ~ \.(php|phtml|phar)$ { deny all; }

        try_files $uri =404;
    }

    # Statikus eszkozok (CSS, JS, logo)
    location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Az admin felulet SAJAT belepesi pont - ezert kulon blokk kell neki.
    # A tobbi keres az index.php-hoz megy (lasd lent), ezert ha ez a blokk
    # hianyzik, az /admin.php helyett is a nyilvanos sugo jonne be.
    #
    # Ha korlatozni akarod, hogy honnan legyen elerheto, ide tedd:
    #     allow 10.0.0.0/8;  deny all;
    # vagy egy auth_basic-et.
    # ------------------------------------------------------------------
    location = /admin.php {
        include fastcgi_params;
        fastcgi_pass help_php;
        fastcgi_param SCRIPT_FILENAME $document_root/admin.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;      # a Word-export/import hosszabb lehet
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Beagyazhato (iframe) nezet - ird be a valodi Infinity domain(eke)t
    location ~ ^/(hu|en|de)/embed/ {
        add_header Content-Security-Policy "frame-ancestors https://app.infinityhu.eu https://*.infinityhu.eu" always;
        try_files $uri /index.php$is_args$args;
    }

    # Minden mas kerest a nyilvanos sugo sajat routere dolgoz fel
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass help_php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 600s;
    }
}
