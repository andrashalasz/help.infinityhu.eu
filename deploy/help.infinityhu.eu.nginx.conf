# /etc/nginx/sites-available/help.infinityhu.eu
#
# A sugo teljesen statikus (elore legeneralt HTML/CSS/JS/kep), ezert PHP-ra
# vagy adatbazisra nincs szukseg a kiszolgalashoz — csak a build_site.py
# altal generalt site/ konyvtar tartalmat kell a helyere masolni.
#
# Frissiteshez:
#   python3 build_site.py --out site --base https://help.infinityhu.eu
#   rsync -a --delete site/ szerver:/var/www/help.infinityhu.eu/site/
#
# Engedelyezes:  ln -s /etc/nginx/sites-available/help.infinityhu.eu /etc/nginx/sites-enabled/
#                nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name help.infinityhu.eu;
    return 301 https://help.infinityhu.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name help.infinityhu.eu;

    ssl_certificate     /etc/letsencrypt/live/help.infinityhu.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/help.infinityhu.eu/privkey.pem;

    root  /var/www/help.infinityhu.eu/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    access_log /var/log/nginx/help.infinityhu.eu.access.log;
    error_log  /var/log/nginx/help.infinityhu.eu.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /404.html;

    # ---------------------------------------------------------------
    # STATIKUS ESZKOZOK (kepek, css, js) — hosszu cache, barhonnan
    # Ez a blokk mindenhol ervenyesul, embed mappan belul is, mert a
    # kiterjesztes szamit, nem a konyvtar.
    # ---------------------------------------------------------------
    location ~* \.(png|jpe?g|webp|gif|svg|ico|css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # KERESO-INDEX ES FEJEZET-JSON — az admin/olvaso ezt hivja fetch-csel
    # ---------------------------------------------------------------
    location /api/ {
        add_header Cache-Control "public, max-age=1800" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # BEAGYAZHATO (embed) OLDALAK — kifejezetten iframe-be valok.
    # Csereld ki a peldat a valodi Infinity domain(ek)re! Az
    # X-Frame-Options SZANDEKOSAN nincs itt beallitva — az tiltana
    # a beagyazast, amit ez a blokk eppen hogy engedelyez.
    # ---------------------------------------------------------------
    location ~ ^/(hu|en|de)/embed/ {
        add_header Content-Security-Policy "frame-ancestors https://app.infinityhu.eu https://*.infinityhu.eu" always;
        add_header Cache-Control "public, max-age=1800" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------
    # TELJES OLDALAK — onallo bongeszesre valok, sehonnan nem
    # agyazhatok be.
    # ---------------------------------------------------------------
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=1800" always;
        try_files $uri $uri/ =404;
    }
}
