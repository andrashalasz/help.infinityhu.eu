# /etc/apache2/sites-available/help.infinityhu.eu.conf
#
# A sugo teljesen statikus (elore legeneralt HTML/CSS/JS/kep), ezert nincs
# szuksege PHP-ra vagy adatbazisra a kiszolgalashoz — csak a helyre kell
# masolni a build_site.py altal generalt site/ konyvtar tartalmat.
#
# Frissiteshez ugyanez: python3 build_site.py --out site --base https://help.infinityhu.eu
# majd a site/ tartalmat felulirni a szerveren (rsync -a --delete site/ ...).

<VirtualHost *:443>
    ServerName help.infinityhu.eu
    DocumentRoot /var/www/help.infinityhu.eu/site

    <Directory /var/www/help.infinityhu.eu/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # A ROOT oldalak (pl. /hu/5-4-....html) NEM agyazhatok be sehonnan —
        # ezek a bongeszo cimsoraban valo, onallo hasznalatra valok.
        Header set X-Frame-Options "DENY"
        Header set Content-Security-Policy "frame-ancestors 'none'"
    </Directory>

    # Az EMBED oldalak (pl. /hu/embed/5-4-....html) VISZONT kifejezetten
    # beagyazasra keszultek — ezeknel az Infinity sajat domainjet(oket)
    # kell engedelyezni. Cimezd at a peldakat a valodi Infinity domain(ek)re.
    <LocationMatch "^/(hu|en|de)/embed/">
        Header unset X-Frame-Options
        Header set Content-Security-Policy "frame-ancestors https://app.infinityhu.eu https://*.infinityhu.eu"
    </LocationMatch>

    # Tomorites es cache — a tartalom ritkan valtozik, nyugodtan cachelheto
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json
    </IfModule>
    <FilesMatch "\.(html|json)$">
        Header set Cache-Control "public, max-age=1800"
    </FilesMatch>
    <FilesMatch "\.(png|jpg|jpeg|webp|css|js)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    ErrorDocument 404 /404.html

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/help.infinityhu.eu/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/help.infinityhu.eu/privkey.pem
</VirtualHost>

<VirtualHost *:80>
    ServerName help.infinityhu.eu
    Redirect permanent / https://help.infinityhu.eu/
</VirtualHost>
